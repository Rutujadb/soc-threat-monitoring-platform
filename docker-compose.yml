services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./rules:/app/rules:ro
      - ./playbooks:/app/playbooks:ro
      - soc_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/soc_platform.db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - VITE_API_PROXY=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  soc_data:
